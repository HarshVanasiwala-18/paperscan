[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperscan"
version = "0.1.0"
description = "Multi-layer prompt injection detector for PDF and DOCX documents"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.11,<2.0.0",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "anthropic>=0.40.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
]

[project.scripts]
paperscan = "paperscan.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
qr = [
    "pyzbar>=0.1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
